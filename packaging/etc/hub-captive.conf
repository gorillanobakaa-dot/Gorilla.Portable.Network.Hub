# Version: 1.0.0 · updated 26-08-25-08-06
# Gorilla Portable Network Hub: captive-portal answers for the classroom hotspot.
#
# NetworkManager reads this directory ONLY when it starts dnsmasq for a
# SHARED connection (a hotspot). Normal wifi browsing never touches it.
#
# What this does: when a phone or laptop joins the hotspot, it silently asks
# one of these names "is there internet?". Answering with the teacher's own
# address makes the device pop its sign-in screen, and the sign-in screen IS
# the class page. Without this file a joining phone says "no internet" and
# gives the kid nothing to tap.
#
# Only the well-known probe names are answered, not everything, so a hotspot
# that really is sharing an internet connection keeps working for real sites.
#
# 10.42.0.1 is the address NetworkManager gives the machine running the
# hotspot. If yours is configured differently, change it here to match.
address=/connectivitycheck.gstatic.com/10.42.0.1
address=/connectivitycheck.android.com/10.42.0.1
address=/clients3.google.com/10.42.0.1
address=/captive.apple.com/10.42.0.1
address=/www.msftconnecttest.com/10.42.0.1
address=/dns.msftncsi.com/10.42.0.1
address=/detectportal.firefox.com/10.42.0.1
address=/nmcheck.gnome.org/10.42.0.1
address=/networkcheck.kde.org/10.42.0.1
address=/connectivity-check.ubuntu.com/10.42.0.1
address=/network-test.debian.org/10.42.0.1

# Friendly names, so nobody types an address at all. A kid can type
# "classroom/" into any browser on the hotspot and land on the class page.
# The trailing slash matters: a bare word typed into a phone's browser bar is
# sent to a search engine (which is dead here anyway), but a word with a
# slash is treated as a place to go. Several spellings, because the teacher
# will say it out loud and the kids will type what they heard.
address=/classroom/10.42.0.1
address=/class/10.42.0.1
address=/lesson/10.42.0.1
address=/school/10.42.0.1
address=/hub/10.42.0.1
